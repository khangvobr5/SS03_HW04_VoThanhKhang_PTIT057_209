<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="100%" height="100%">
  <rect width="920" height="560" fill="rgb(15, 23, 42)" rx="8"/>
  <rect width="920" height="38" fill="rgb(30, 41, 59)" rx="8"/>
  <circle cx="20" cy="19" r="6" fill="rgb(239, 68, 68)"/>
  <circle cx="38" cy="19" r="6" fill="rgb(245, 158, 11)"/>
  <circle cx="56" cy="19" r="6" fill="rgb(34, 197, 94)"/>
  <text x="300" y="24" fill="rgb(148, 163, 184)" font-family="Segoe UI, -apple-system, sans-serif" font-size="12">Terminal: devops@ubuntu-devops-server — Multi-Port Virtual Hosts</text>

  <g font-family="Courier New, Consolas, monospace" font-size="13">
    <!-- Command 1: UFW allow ports -->
    <text x="24" y="66" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="66" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="275" y="66" fill="rgb(56, 189, 248)">sudo ufw allow 8080/tcp &amp;&amp; sudo ufw allow 8090/tcp</text>
    <text x="24" y="88" fill="rgb(203, 213, 225)">Rules updated</text>
    <text x="24" y="106" fill="rgb(203, 213, 225)">Rules updated (v6)</text>

    <!-- Command 2: Nginx -t -->
    <text x="24" y="136" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="136" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="275" y="136" fill="rgb(56, 189, 248)">sudo nginx -t</text>
    <text x="24" y="158" fill="rgb(203, 213, 225)">nginx: the configuration file /etc/nginx/nginx.conf syntax is ok</text>
    <text x="24" y="176" fill="rgb(34, 197, 94)">nginx: configuration file /etc/nginx/nginx.conf test is successful</text>

    <!-- Command 3: Reload -->
    <text x="24" y="206" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="206" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="275" y="206" fill="rgb(56, 189, 248)">sudo systemctl reload nginx</text>

    <!-- Command 4: curl 8080 -->
    <text x="24" y="244" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="244" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="275" y="244" fill="rgb(56, 189, 248)">curl -I http://localhost:8080</text>
    <text x="24" y="270" fill="rgb(34, 197, 94)" font-weight="bold">HTTP/1.1 200 OK</text>
    <text x="24" y="290" fill="rgb(203, 213, 225)">Server: nginx/1.18.0 (Ubuntu)</text>
    <text x="24" y="310" fill="rgb(245, 158, 11)" font-weight="bold">Content-Type: text/html (Beta App)</text>

    <!-- Command 5: curl 8090 -->
    <text x="24" y="348" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="348" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="275" y="348" fill="rgb(56, 189, 248)">curl -I http://localhost:8090</text>
    <text x="24" y="374" fill="rgb(34, 197, 94)" font-weight="bold">HTTP/1.1 200 OK</text>
    <text x="24" y="394" fill="rgb(203, 213, 225)">Server: nginx/1.18.0 (Ubuntu)</text>
    <text x="24" y="414" fill="rgb(16, 185, 129)" font-weight="bold">Content-Type: text/html (Internal App)</text>

    <!-- Command 6: ss check ports -->
    <text x="24" y="452" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="452" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="275" y="452" fill="rgb(56, 189, 248)">sudo ss -tulpn | grep nginx</text>
    <text x="24" y="478" fill="rgb(203, 213, 225)">tcp   LISTEN 0   511   0.0.0.0:8080   0.0.0.0:0   users:(("nginx",pid=1250,fd=6))</text>
    <text x="24" y="498" fill="rgb(203, 213, 225)">tcp   LISTEN 0   511   0.0.0.0:8090   0.0.0.0:0   users:(("nginx",pid=1250,fd=8))</text>

    <text x="24" y="534" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="534" fill="rgb(248, 250, 252)">:~$ </text>
  </g>
</svg>
